<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A map of food and drink deals in Ann Arbor, updated daily from restaurants' own websites." />
    <meta name="theme-color" content="#0e1b2e" />
    <script>
      // Set the theme before the page paints: the saved choice, else the device's.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <title>ArborEats: food deals in Ann Arbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="panel">
      <header>
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" />
              <circle cx="12" cy="9.5" r="2.2" />
            </svg>
          </span>
          <h1>ArborEats</h1>
          <button id="theme" class="theme" aria-label="Switch to dark mode">
            <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.500 10.500z" />
            </svg>
            <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400" />
            </svg>
          </button>
        </div>
        <p class="summary" aria-live="polite"><strong id="count">–</strong> <span id="summary">Loading deals…</span></p>
      </header>

      <div class="filters" id="filters">
        <div class="filters-head">
          <h2>Filters</h2>
          <button id="filters-close" class="done">Done</button>
        </div>
        <div class="days" id="days" role="group" aria-label="When"></div>
        <div class="pills">
          <div class="pill-group" id="categories" role="group" aria-label="Type of deal">
            <button data-category="all">Everything</button>
            <button data-category="food">Food</button>
            <button data-category="drink">Drinks</button>
          </div>
          <div class="pill-group" id="owners" role="group" aria-label="Type of restaurant">
            <button data-owner="local" aria-pressed="false">Local only</button>
            <button data-owner="chain" aria-pressed="false">Chains only</button>
          </div>
        </div>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <span class="visually-hidden">Search restaurants or deals</span>
          <input type="search" id="search" placeholder="Search tacos, happy hour, a place…" />
        </label>
      </div>

      <ol id="list"></ol>
      <button id="filters-open" class="fab" aria-controls="filters" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M7 12h10M10 18h4" />
        </svg>
        Filters<span id="filters-count" class="fab-count"></span>
      </button>
      <footer>Scraped from restaurants' own websites and not always right. Confirm with the restaurant before you go.</footer>
    </aside>

    <main>
      <div id="map"></div>
      <div id="status" class="status"></div>
    </main>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
